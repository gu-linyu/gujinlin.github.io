```html
<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gu 的个人网站</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            background:
            linear-gradient(
                135deg,
                #050816,
                #0f172a,
                #111827
            );

            overflow:hidden;
            font-family:Arial, Helvetica, sans-serif;
            color:white;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            text-align:center;
            z-index:2;
        }

        h1{
            font-size:80px;
            margin-bottom:20px;

            background:linear-gradient(
                90deg,
                #00ffff,
                #00aaff,
                #ffffff
            );

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;

            animation: glow 2s infinite alternate;
        }

        p{
            font-size:24px;
            color:#b0b0b0;
            margin-bottom:40px;
        }

        .btn{
            padding:18px 45px;
            font-size:20px;
            border:none;
            border-radius:50px;
            cursor:pointer;

            background:linear-gradient(
                90deg,
                #00c6ff,
                #0072ff
            );

            color:white;

            transition:0.3s;
            box-shadow:0 0 20px rgba(0,150,255,0.5);
        }

        .btn:hover{
            transform:scale(1.1);
            box-shadow:0 0 40px rgba(0,150,255,0.8);
        }

        .circle{
            position:absolute;
            border-radius:50%;
            filter:blur(100px);
            opacity:0.5;
        }

        .c1{
            width:300px;
            height:300px;
            background:#00ffff;
            top:-100px;
            left:-100px;
        }

        .c2{
            width:300px;
            height:300px;
            background:#0066ff;
            bottom:-100px;
            right:-100px;
        }

        @keyframes glow{
            from{
                text-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff;
            }

            to{
                text-shadow:
                0 0 20px #00aaff,
                0 0 40px #00aaff;
            }
        }

        @media(max-width:768px){

            h1{
                font-size:50px;
            }

            p{
                font-size:18px;
            }

            .btn{
                padding:15px 35px;
                font-size:18px;
            }
        }
    </style>
</head>

<body>

    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="container">

        <h1>GU WEBSITE</h1>

        <p>
            欢迎来到我的个人网站
        </p>

        <button class="btn" onclick="showMessage()">
            点击进入
        </button>

    </div>

    <script>

        function showMessage(){

            alert("网站运行成功！");
        }

    </script>

</body>

</html>
```
